<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#187F3B">
    <meta property="og:image" content="https://bigcheese.co.kr/og_bc.png">
    <meta property="og:title" content="bigcheese">
    <meta property="og:description" content="Living the cheese life">
    <meta property="og:url" content="https://bigcheese.co.kr">
    
    <title>bigcheese</title>
    <link rel="icon" type="image/png" sizes="196x196" href="https://cdn.imweb.me/thumbnail/20250306/180662c3f2550.png">
    <link rel="apple-touch-icon" sizes="152x152" href="https://cdn.imweb.me/thumbnail/20250306/79da13c0d3a05.png">    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        html, body {
            height: 100%;
            width: 100%;
            overflow: hidden;
            background: #187F3B;
        }
        
        #target-frame {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            margin: 0 auto;
            width: 100%;
            max-width: 480px;
            height: 100%;
            border: none;
            z-index: 10;
        }

        @media (min-width: 768px) {
            html, body {
                background: linear-gradient(90deg, #f2f2f2 calc(50% - 240px), #fff 0 calc(50% + 240px), #f2f2f2 0);
            }
        }
    </style>
</head>
<body>
    <iframe id="target-frame" title="bigcheese"></iframe>
    
    <script>
        // 페이지 로드 완료 시 실행
        document.addEventListener('DOMContentLoaded', function() {
            // 현재 URL 정보 가져오기
            var currentLocation = window.location;
            var hostname = currentLocation.hostname;
            
            // iframe 요소 가져오기
            var iframe = document.getElementById('target-frame');
            
            // 호스트명에 따라 iframe 소스 설정
            if (hostname === "bigcheese.co.kr") {
                iframe.src = "https://bigcheese.imweb.me/bigcheese";
            } else {
                // 다른 도메인에서 접속했을 경우 bigcheese.co.kr로 리다이렉트
                window.location.href = "https://bigcheese.co.kr";
            }
        });
    </script>
</body>
</html>
