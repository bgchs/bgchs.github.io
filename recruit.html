<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#F8F4E7">
    <meta name="robots" content="noindex">
    <title>채용 지원 | bigcheese</title>
    <link rel="icon" type="image/png" sizes="196x196" href="https://cdn.imweb.me/thumbnail/20250306/180662c3f2550.png">
    <link rel="stylesheet" crossorigin href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
    <link rel="stylesheet" href="https://db.onlinewebfonts.com/c/5c0061329daf2f48e14b0ddaea9b90f3?family=Industry+Inc+Test+Base">
    <style>
        /* 빅치즈 디자인 규격 — 앱 header.html과 같은 토큰 · 컴포넌트 (필요한 것만) */
        :root {
            --bc-color-primary: #187F3B;
            --bc-color-on-primary: #F8F4E7;
            --bc-color-surface: #F8F4E7;
            --bc-color-surface-container-lowest: #FFFFFF;
            --bc-color-on-surface: #333333;
            --bc-color-on-surface-variant: #777777;
            --bc-color-outline: #CCCCCC;
            --bc-color-error: #E4007F;
            --bc-color-inverse-surface: #333333;
            --bc-color-inverse-on-surface: #F8F4E7;
            --bc-font-body: "Pretendard Variable", Pretendard, -apple-system, BlinkMacSystemFont, system-ui, Roboto, sans-serif;
            --bc-font-display: 'Industry Inc Test Base', sans-serif;
            --bc-type-headline-s: 400 24px/32px var(--bc-font-display);
            --bc-type-title-m-em: 600 16px/24px var(--bc-font-body);
            --bc-type-title-m: 500 16px/24px var(--bc-font-body);
            --bc-type-body-l: 400 16px/24px var(--bc-font-body);
            --bc-type-body-m: 400 14px/20px var(--bc-font-body);
            --bc-type-body-s: 400 12px/16px var(--bc-font-body);
            --bc-space-4: 4px; --bc-space-8: 8px; --bc-space-12: 12px; --bc-space-16: 16px; --bc-space-24: 24px; --bc-space-32: 32px;
            --bc-radius-input: 16px; --bc-radius-card: 16px; --bc-radius-list-item: 4px; --bc-radius-full: 999px;
            --bc-layout-margin: 16px; --bc-layout-max-width: 440px;
            --bc-touch-min: 44px;
            --bc-elevation-1: 0 0.1px 1px 0 rgba(0, 0, 0, 0.1), 0 1px 3px 1px rgba(0, 0, 0, 0.03);
            --bc-elevation-3: 0 1px 3px 0 rgba(0, 0, 0, 0.30), 0 4px 8px 3px rgba(0, 0, 0, 0.15);
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            background: var(--bc-color-surface); color: var(--bc-color-on-surface);
            font: var(--bc-type-body-l); word-break: keep-all; -webkit-tap-highlight-color: transparent;
        }
        [hidden] { display: none !important; }

        /* bc-page */
        .bc-page {
            width: 100%; max-width: var(--bc-layout-max-width); margin: 0 auto;
            padding: var(--bc-space-32) var(--bc-layout-margin); font-kerning: normal;
        }
        .bc-headline-s { font: var(--bc-type-headline-s); }
        .bc-body-s { font: var(--bc-type-body-s); }

        /* bc-input + bc-field (M3 filled text field) */
        .bc-input {
            width: 100%; height: 48px; padding: 0 var(--bc-space-16);
            border: 0; border-radius: var(--bc-radius-input); outline: none;
            font: var(--bc-type-body-l); color: var(--bc-color-on-surface);
            background: var(--bc-color-surface-container-lowest);
            -webkit-appearance: none; appearance: none;
        }
        .bc-input::placeholder  { color: var(--bc-color-outline); }
        .bc-input:focus-visible { box-shadow: inset 0 0 0 2px var(--bc-color-primary); }
        textarea.bc-input { resize: none; }
        .bc-field { position: relative; display: block; }
        .bc-field .bc-input { display: block; height: 56px; padding: 24px var(--bc-space-16) 8px; }
        .bc-field textarea.bc-input { height: 56px; min-height: 56px; overflow: hidden; }
        .bc-field-label {
            position: absolute; left: var(--bc-space-16); right: var(--bc-space-16); top: 16px;
            overflow: hidden; white-space: nowrap; text-overflow: ellipsis; pointer-events: none;
            font: var(--bc-type-body-l); color: var(--bc-color-on-surface-variant);
            transition: top 0.15s, font-size 0.15s, line-height 0.15s;
        }
        .bc-field .bc-input:focus + .bc-field-label,
        .bc-field .bc-input:not(:placeholder-shown) + .bc-field-label,
        .bc-field.is-fixed .bc-field-label { top: 8px; font: var(--bc-type-body-s); }
        .bc-field .bc-input:focus + .bc-field-label { color: var(--bc-color-primary); }
        .bc-field .bc-input::placeholder       { color: transparent; }
        .bc-field .bc-input:focus::placeholder { color: var(--bc-color-outline); }
        .bc-field-support { display: block; margin-top: var(--bc-space-4); padding: 0 var(--bc-space-16); font: var(--bc-type-body-s); color: var(--bc-color-on-surface-variant); }
        .bc-field-support.is-error-msg { display: none; color: var(--bc-color-error); }
        .bc-field.is-error .bc-input,
        .bc-field.is-error .rc-file { box-shadow: inset 0 0 0 2px var(--bc-color-error); }
        .bc-field.is-error .bc-field-label { color: var(--bc-color-error); }
        .bc-field.is-error .is-error-msg { display: block; }
        .bc-field.is-error .is-hint { display: none; }

        /* 파일 칸: bc-field 모양, 라벨은 항상 위(is-fixed) */
        .rc-file {
            display: flex; align-items: flex-end; height: 56px; padding: 24px var(--bc-space-16) 8px;
            border-radius: var(--bc-radius-input); background: var(--bc-color-surface-container-lowest); cursor: pointer;
        }
        .rc-file input { position: absolute; width: 1px; height: 1px; opacity: 0; pointer-events: none; }
        .rc-file:focus-within { box-shadow: inset 0 0 0 2px var(--bc-color-primary); }
        .rc-file-name { min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; color: var(--bc-color-outline); }
        .rc-file-name.is-set { color: var(--bc-color-on-surface); }

        /* bc-card */
        .bc-card {
            display: flex; flex-direction: column; padding: var(--bc-space-16);
            border-radius: var(--bc-radius-card); background: var(--bc-color-surface-container-lowest);
            box-shadow: var(--bc-elevation-1);
        }

        /* bc-btn L block */
        .bc-btn {
            position: relative; display: inline-flex; align-items: center; justify-content: center;
            border: none; border-radius: var(--bc-radius-full); cursor: pointer;
            background: var(--bc-color-primary); color: var(--bc-color-on-primary);
        }
        .bc-btn:disabled { opacity: 0.38; cursor: default; }
        .bc-btn::before {
            content: ''; position: absolute; inset: 0; border-radius: inherit; pointer-events: none;
            background: currentColor; opacity: 0; transition: opacity 0.15s;
        }
        .bc-btn:active:not(:disabled)::before { opacity: 0.1; }
        .bc-btn-l { min-height: 48px; padding: 0 var(--bc-space-24); font: var(--bc-type-title-m-em); }
        .bc-btn-block { display: flex; width: 100%; }

        /* bc-snackbar */
        .bc-snackbar {
            position: fixed; left: 50%; bottom: var(--bc-space-16); transform: translateX(-50%);
            width: calc(100% - 32px); max-width: calc(var(--bc-layout-max-width) - 32px);
            display: none; align-items: center; min-height: 48px; padding: var(--bc-space-12) var(--bc-space-16);
            border-radius: var(--bc-radius-list-item);
            font: var(--bc-type-body-m); background: var(--bc-color-inverse-surface); color: var(--bc-color-inverse-on-surface);
            box-shadow: var(--bc-elevation-3);
        }
        .bc-snackbar.is-open { display: flex; }

        /* 이 화면 배치 */
        .rc-top    { display: flex; align-items: center; justify-content: space-between; gap: var(--bc-space-16); }
        .rc-top h1 { color: var(--bc-color-primary); }
        .rc-logo {
            display: block; line-height: 0; background: var(--bc-color-primary);
            -webkit-mask: url(https://cdn.jsdelivr.net/gh/bgchs/bgchs.github.io@main/logo_bc.svg) left center / contain no-repeat;
                    mask: url(https://cdn.jsdelivr.net/gh/bgchs/bgchs.github.io@main/logo_bc.svg) left center / contain no-repeat;
        }
        .rc-logo img { display: block; height: 40px; width: auto; opacity: 0; }
        .rc-poster { display: block; width: 100%; height: auto; margin: var(--bc-space-24) 0; border-radius: var(--bc-radius-card); }
        .rc-fields { display: flex; flex-direction: column; gap: var(--bc-space-8); }
        .rc-agree  { margin-top: var(--bc-space-16); }
        .rc-agree-title { font: var(--bc-type-title-m); }
        .rc-agree-list  { list-style: none; margin-top: var(--bc-space-4); font: var(--bc-type-body-m); color: var(--bc-color-on-surface-variant); }
        .rc-agree-row   { display: flex; align-items: center; gap: var(--bc-space-12); min-height: var(--bc-touch-min); margin-top: var(--bc-space-8); cursor: pointer; }
        .rc-agree-row input { width: 18px; height: 18px; margin: 0; flex-shrink: 0; accent-color: var(--bc-color-primary); }
        .rc-agree.is-error { box-shadow: inset 0 0 0 2px var(--bc-color-error); }
        .rc-submit { margin-top: var(--bc-space-16); }
        .rc-done   { text-align: center; }
        .rc-privacy { display: block; margin-top: var(--bc-space-16); text-align: center; color: var(--bc-color-on-surface-variant); }
    </style>
</head>
<body>
<main class="bc-page">
    <header class="rc-top">
        <a class="rc-logo" href="/"><img src="https://cdn.jsdelivr.net/gh/bgchs/bgchs.github.io@main/logo_bc.svg" alt="bigcheese"></a>
        <h1 class="bc-headline-s">RECRUIT</h1>
    </header>

    <img class="rc-poster" src="https://bgchs.github.io/hiring_poster.png" alt="WE'RE HIRING">

    <form id="rc-form" novalidate>
        <div class="rc-fields">
            <label class="bc-field">
                <input class="bc-input" id="rc-name" type="text" maxlength="50" autocomplete="name" placeholder=" ">
                <span class="bc-field-label">이름</span>
                <span class="bc-field-support is-error-msg"></span>
            </label>
            <label class="bc-field">
                <input class="bc-input" id="rc-phone" type="tel" inputmode="numeric" maxlength="13" autocomplete="tel" placeholder="010-0000-0000">
                <span class="bc-field-label">연락처</span>
                <span class="bc-field-support is-error-msg"></span>
            </label>
            <label class="bc-field">
                <textarea class="bc-input" id="rc-content" maxlength="1000" placeholder=" "></textarea>
                <span class="bc-field-label">내용</span>
                <span class="bc-field-support is-error-msg"></span>
                <span class="bc-field-support is-hint"><span id="rc-count">0</span> / 1000</span>
            </label>
            <div class="bc-field is-fixed">
                <label class="rc-file">
                    <input id="rc-file" type="file" accept=".pdf,.jpg,.jpeg,.png,.doc,.docx,.hwp,.hwpx,.ppt,.pptx,.zip">
                    <span class="rc-file-name" id="rc-file-name">파일 선택</span>
                </label>
                <span class="bc-field-label">파일</span>
                <span class="bc-field-support is-error-msg"></span>
                <span class="bc-field-support is-hint">PDF · 이미지 · DOC · HWP · PPT · ZIP, 50MB 이하</span>
            </div>
        </div>

        <div class="bc-card rc-agree" id="rc-agree-card">
            <p class="rc-agree-title">개인정보 수집·이용 동의</p>
            <ul class="rc-agree-list">
                <li>항목: 이름, 연락처, 지원 내용, 첨부 파일</li>
                <li>목적: 채용 전형 진행</li>
                <li>보유 기간: 채용 전형 완료 후 3개월</li>
            </ul>
            <label class="rc-agree-row"><input type="checkbox" id="rc-agree"> 동의합니다</label>
        </div>

        <button class="bc-btn bc-btn-l bc-btn-block rc-submit" id="rc-submit" type="submit">지원하기</button>
    </form>

    <div class="bc-card rc-done" id="rc-done" hidden>지원이 접수되었습니다.</div>

    <a class="bc-body-s rc-privacy" href="/privacy">개인정보처리방침</a>
</main>

<div class="bc-snackbar" id="rc-snackbar" role="status"></div>

<script type="module">
    import { initializeApp } from 'https://www.gstatic.com/firebasejs/12.9.0/firebase-app.js';
    import { getStorage, ref, uploadBytesResumable } from 'https://www.gstatic.com/firebasejs/12.9.0/firebase-storage.js';

    const firebaseConfig = {
        apiKey: 'AIzaSyC2IqqRuw4dpM2UWC1Zp8P3Z7qaJGHE6ZE',
        authDomain: 'bigcheese-on-data.firebaseapp.com',
        projectId: 'bigcheese-on-data',
        storageBucket: 'bigcheese-on-data.firebasestorage.app',
        messagingSenderId: '957073358675',
        appId: '1:957073358675:web:afef19212cea7548ffeba6'
    };

    const MAX_SIZE = 50 * 1024 * 1024;
    const EXT_RE = /\.(pdf|jpe?g|png|docx?|hwpx?|pptx?|zip)$/i;

    const storage = getStorage(initializeApp(firebaseConfig));
    const $ = (id) => document.getElementById(id);
    const form = $('rc-form'), submitBtn = $('rc-submit');

    /* BCField (앱 footer와 같은 동작) */
    const BCField = {
        autoGrow(el) {
            el.style.height = 'auto';
            el.style.height = Math.max(56, el.scrollHeight) + 'px';
        },
        setError(el, msg) {
            const box = el.closest('.bc-field');
            box.classList.add('is-error');
            box.querySelector('.is-error-msg').textContent = msg;
        },
        showErrors(list) {
            list.forEach(([el, msg]) => BCField.setError(el, msg));
            if (list[0]) list[0][0].focus();
        }
    };
    document.addEventListener('input', (e) => {
        const field = e.target.closest && e.target.closest('.bc-field.is-error');
        if (field) field.classList.remove('is-error');
    });

    /* BCSnackbar (앱 footer와 같은 동작) */
    let snackTimer;
    function snackbar(text) {
        const s = $('rc-snackbar');
        s.textContent = text;
        s.classList.add('is-open');
        clearTimeout(snackTimer);
        snackTimer = setTimeout(() => s.classList.remove('is-open'), 4000);
    }

    $('rc-phone').addEventListener('input', (e) => {
        const d = e.target.value.replace(/\D/g, '').slice(0, 11);
        const isDelete = (e.inputType || '').startsWith('delete');
        let v = d.slice(0, 3);
        if (d.length > 3 || (d.length === 3 && !isDelete)) v += '-' + d.slice(3, 7);
        if (d.length > 7 || (d.length === 7 && !isDelete)) v += '-' + d.slice(7);
        e.target.value = v;
    });

    $('rc-content').addEventListener('input', (e) => {
        BCField.autoGrow(e.target);
        $('rc-count').textContent = e.target.value.length;
    });

    $('rc-file').addEventListener('change', (e) => {
        e.target.closest('.bc-field').classList.remove('is-error');
        const f = e.target.files[0];
        $('rc-file-name').textContent = f ? f.name : '파일 선택';
        $('rc-file-name').classList.toggle('is-set', !!f);
    });

    $('rc-agree').addEventListener('change', () => $('rc-agree-card').classList.remove('is-error'));

    form.addEventListener('submit', (e) => {
        e.preventDefault();
        const name = $('rc-name').value.trim();
        const phone = $('rc-phone').value.trim();
        const content = $('rc-content').value.trim();
        const file = $('rc-file').files[0];

        const errors = [];
        if (!name) errors.push([$('rc-name'), '이름을 입력해주세요.']);
        if (phone.replace(/\D/g, '').length < 10) errors.push([$('rc-phone'), '연락처를 입력해주세요.']);
        if (!content) errors.push([$('rc-content'), '내용을 입력해주세요.']);
        if (!file) errors.push([$('rc-file'), '파일을 선택해주세요.']);
        else if (!EXT_RE.test(file.name)) errors.push([$('rc-file'), '지원하지 않는 파일 형식입니다.']);
        else if (file.size >= MAX_SIZE) errors.push([$('rc-file'), '50MB 이하 파일만 올릴 수 있습니다.']);

        const agreed = $('rc-agree').checked;
        $('rc-agree-card').classList.toggle('is-error', !agreed);

        if (errors.length) { BCField.showErrors(errors); return; }
        if (!agreed) { $('rc-agree').focus(); return; }
        if (!navigator.onLine) { snackbar('인터넷 연결을 확인해주세요.'); return; }

        submitBtn.disabled = true;
        const fileName = file.name.replace(/[\/\\]/g, '_');
        const task = uploadBytesResumable(ref(storage, `recruit/${crypto.randomUUID()}/${fileName}`), file, {
            customMetadata: { name, phone, content }
        });

        task.on('state_changed',
            (s) => { submitBtn.textContent = `${Math.floor(s.bytesTransferred / s.totalBytes * 100)}%`; },
            () => {
                submitBtn.disabled = false;
                submitBtn.textContent = '지원하기';
                snackbar('제출하지 못했습니다. 다시 시도해주세요.');
            },
            () => {
                form.hidden = true;
                $('rc-done').hidden = false;
            }
        );
    });
</script>
</body>
</html>
